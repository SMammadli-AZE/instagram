<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in</title>
<style>
:root {
  --bg: #ffffff; --text: #1a1a1c; --muted: #6b6b73; --field-border: #c9c9d0;
  --primary: #2a64d8; --primary-text: #ffffff; --outline: #2a64d8; --error: #c62f2f; --logo-bg: #2a64d8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1e20; --text: #f2f2f3; --muted: #9a9aa0; --field-border: #4a4a50;
    --primary: #2a64d8; --outline: #5b9cf0; --error: #ff7a7a; --logo-bg: #3a74e8;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1e20; --text: #f2f2f3; --muted: #9a9aa0; --field-border: #4a4a50;
  --primary: #2a64d8; --outline: #5b9cf0; --error: #ff7a7a; --logo-bg: #3a74e8;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.page {
  min-height: 100%; max-width: 420px; margin: 0 auto; padding: 20px 24px 24px;
  display: flex; flex-direction: column; align-items: stretch;
}
.lang { text-align: center; color: var(--muted); font-size: 15px; }
.logo-wrap { display: flex; justify-content: center; margin: 12vh 0 9vh; }
.logo {
  width: 84px; height: 84px; border-radius: 24px; object-fit: cover;
}
.fields { display: flex; flex-direction: column; gap: 14px; }
.field { position: relative; }
.field input {
  width: 100%; height: 58px; padding: 0 20px; font-size: 17px; color: var(--text);
  background: transparent; border: 1.5px solid var(--field-border); border-radius: 29px;
}
.field input::placeholder { color: var(--muted); }
.field input:focus-visible { outline: 2px solid var(--outline); outline-offset: 2px; }
.field input[aria-invalid="true"] { border-color: var(--error); }
.toggle {
  position: absolute; right: 8px; top: 8px; height: 42px; padding: 0 14px;
  background: none; border: 0; border-radius: 21px; color: var(--muted); font-size: 15px; cursor: pointer;
}
.toggle:focus-visible { outline: 2px solid var(--outline); }
.error { min-height: 20px; margin: 10px 4px 0; font-size: 14px; color: var(--error); }
.btn {
  width: 100%; height: 56px; border-radius: 28px; font-size: 17px; font-weight: 600; cursor: pointer;
}
.btn:focus-visible { outline: 2px solid var(--outline); outline-offset: 3px; }
.btn-primary { background: var(--primary); color: var(--primary-text); border: 0; margin-top: 6px; }
.btn-primary:active { opacity: .85; }
.forgot { display: block; text-align: center; margin: 22px 0 0; color: var(--text); font-size: 17px; text-decoration: none; }
.forgot:hover { text-decoration: underline; }
.bottom { margin-top: auto; padding-top: 32px; text-align: center; }
.btn-outline { background: transparent; color: var(--outline); border: 1.5px solid var(--outline); }
.brand { margin-top: 22px; font-size: 17px; font-weight: 600; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .btn, .toggle { transition: opacity .15s, background-color .15s; }
}
</style>
</head>
<body>
<main class="page">
  <div class="lang">English (US)</div>

  <div class="logo-wrap"><img class="logo" id="logo" src="aze.png" alt="YourApp logo"></div>

  <form id="login" novalidate>
    <div class="fields">
      <div class="field">
        <input id="user" name="username" type="text" placeholder="Username, email or mobile number"
               aria-label="Username, email or mobile number" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <input id="pass" name="password" type="password" placeholder="Password"
               aria-label="Password" autocomplete="current-password">
        <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
    </div>
    <div class="error" id="error" role="alert" aria-live="polite"></div>
    <button type="submit" class="btn btn-primary">Log in</button>
    <a class="forgot" href="#forgot">Forgot password?</a>
  </form>

  <div class="bottom">
    <button type="button" class="btn btn-outline" id="create">Create new account</button>
    <div class="brand" id="brand"></div>
  </div>
</main>

<script>
// Change your app's name here. The logo letter, page title and footer update automatically.
const BRAND = { name: "Meta" };

document.title = "Log in to " + BRAND.name;
document.getElementById("brand").textContent = BRAND.name;

const user = document.getElementById("user");
const pass = document.getElementById("pass");
const error = document.getElementById("error");
const toggle = document.getElementById("toggle");

toggle.addEventListener("click", () => {
  const show = pass.type === "password";
  pass.type = show ? "text" : "password";
  toggle.textContent = show ? "Hide" : "Show";
  toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
  toggle.setAttribute("aria-pressed", String(show));
});

document.getElementById("login").addEventListener("submit", (e) => {
  e.preventDefault();
  user.removeAttribute("aria-invalid");
  pass.removeAttribute("aria-invalid");
  if (!user.value.trim()) {
    user.setAttribute("aria-invalid", "true");
    error.textContent = "Enter your username, email or mobile number.";
    user.focus();
    return;
  }
    if (!pass.value) {
    pass.setAttribute("aria-invalid", "true");
    error.textContent = "Enter your password.";
    pass.focus();
    return;
  }

  error.textContent = "Checking...";
  fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: user.value.trim(), password: pass.value })
  })
    .then(res => res.json().then(data => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {
      error.textContent = data.message;
      if (ok) error.style.color = "#2a9d3d";
    })
    .catch(() => {
      error.textContent = "Could not reach the server.";
    });
});
</script>
</body>
</html>
